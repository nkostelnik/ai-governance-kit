# Synthetic AI use-case intakes for the Stage 6 eval. Fictional; written to vary
# on purpose and to include traps. Separate from samples/intakes (used while
# building), so the eval does not grade the kit on examples it was tuned on.
#
# facts: the levels each case establishes, written by construction (the case
# text states or plainly implies them). This is a fact key, not a risk
# judgment: the expected TIER for each case is the rubric owner's label in
# labels.json. vendor_handling is omitted: it comes from the register, and the
# eval assumes an approved zero-retention tool.

cases:
  - id: UC01
    title: Meeting notes summary
    text: >
      I run the facilities team. After our weekly internal meetings I want to paste
      my rough notes into the company's approved AI assistant and get a clean summary
      with action items, which I check and then email to the five people who attended.
    facts:
      data_sensitivity: [internal]
      personal_data: [employee_contact]
      decision_impact: [draft_reviewed]
      regulated_domain: [no_regulated_domain]
      audience: [internal_shared]
      accuracy_criticality: [errors_harmless]

  - id: UC02
    title: Blog posts from press releases
    text: >
      Marketing wants to use AI to turn our already-published press releases into
      short blog posts for the company website. Each post mentions product features
      and specs. An editor reviews and corrects every post before it is published.
      No customer or employee information is involved.
    facts:
      data_sensitivity: [public]
      personal_data: [no_personal_data]
      decision_impact: [draft_reviewed]
      regulated_domain: [no_regulated_domain]
      audience: [external_reviewed]
      accuracy_criticality: [customer_reliance_verified]

  - id: UC03
    title: Order-status chatbot
    text: >
      Customer Experience wants a chatbot on the website that answers questions about
      order status and return policies. Customers enter their email address and order
      number; the bot looks up the order and replies immediately, with no person
      reviewing each reply. It does not handle payments.
    facts:
      data_sensitivity: [internal]
      personal_data: [customer_basic]
      decision_impact: [automated_action]
      regulated_domain: [no_regulated_domain]
      audience: [external_direct]
      accuracy_criticality: [customer_reliance_unverified]

  - id: UC04
    title: "Trap: 'internal docs' assistant over the legal drive"
    text: >
      Operations would like an AI assistant that answers employee questions by
      searching our internal documents, starting with the shared drives for HR
      policies, IT how-tos, and the legal department. Employees would use the answers
      as a starting point and confirm anything important with the relevant team.
    facts:
      data_sensitivity: [internal, privileged]
      personal_data: [employee_contact]
      decision_impact: [business_decision_human]
      regulated_domain: [no_regulated_domain]
      audience: [internal_shared]
      accuracy_criticality: [errors_moderate]
    trap: The legal department's drive implies privileged material; the description never says so.

  - id: UC05
    title: "Trap: 'productivity' applicant ranking"
    text: >
      To help a stretched recruiting team, HR wants a productivity add-on for our
      applicant tracking system that reads each resume, ranks candidates against the
      job description, and hides the bottom half of the list. Recruiters can still
      open the hidden profiles if they choose to.
    facts:
      data_sensitivity: [internal]
      personal_data: [job_applicant]
      decision_impact: [person_decision_automated]
      regulated_domain: [employment_decision]
      audience: [internal_shared]
      accuracy_criticality: [errors_moderate]
    trap: Framed as productivity; it is an automated employment screen.

  - id: UC06
    title: "Trap: benefits chatbot that hears medical details"
    text: >
      HR wants an internal chatbot that answers employees' questions about our health
      plan, leave policies, and how to request accommodations. Employees type their
      questions in their own words, often describing their medical situation, and the
      bot answers directly from the benefits handbook.
    facts:
      data_sensitivity: [internal]
      personal_data: [health]
      decision_impact: [automated_action]
      regulated_domain: [no_regulated_domain]
      audience: [internal_shared]
      accuracy_criticality: [errors_moderate]
    trap: Sounds like a policy FAQ; employees will volunteer health information.
    key_correction: >
      2026-10-10, after the baseline run: removed employee_hr from the fact key.
      The rubric defines employee_hr as performance, compensation, and discipline
      records; benefits and leave questions are not that. The error was in the
      key, not the model (the model found health information every run).

