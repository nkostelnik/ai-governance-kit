  - id: UC12
    title: Vague forecasting request
    text: Finance would like to start using AI to help with forecasting.
    facts: {}
    trap: Too vague to tier; every dimension should be unknown.

  - id: UC13
    title: "Trap: 'personal brainstorming' with deal names"
    text: >
      Just for my own brainstorming, I'd like to use AI to help me draft talking points
      for the board about the three acquisition targets we are evaluating before the
      deal is announced. Only I will see the output and I'll rewrite it myself.
    facts:
      data_sensitivity: [mnpi, company_confidential]
      personal_data: [no_personal_data]
      decision_impact: [draft_reviewed]
      regulated_domain: [no_regulated_domain]
      audience: [personal_use]
      accuracy_criticality: [errors_harmless]
    trap: Framed as personal and harmless; involves MNPI.

